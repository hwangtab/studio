name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type-check, Lint, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate build manifests
        run: npm run generate:manifests

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Content quality check
        run: npm run content-check:ci

      - name: Test
        run: npm test -- --coverage --passWithNoTests

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://studionol.co.kr
