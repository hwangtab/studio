name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type-check, Lint, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # seo-preflight.test.ts가 관측창 계산을 실제 커밋 이력(1e26671388·8edb2dfbf1)에
          # 고정해 검증한다. 얕은 클론이면 그 커밋이 없어 창 계산이 어긋나고 테스트가
          # 깨진다. check-duplicate-sections·generate-page-lastmod도 이력을 본다.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate build manifests
        run: npm run generate:manifests

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Content quality check
        run: npm run content-check:ci

      - name: Duplicate section check
        run: npm run check:dup-sections

      - name: Fact consistency check
        run: npm run check:facts

      - name: Test
        run: npm test -- --coverage --passWithNoTests

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://studionol.co.kr

  migration-drift:
    name: Migration drift check
    # main에 들어간 마이그레이션이 아직 운영 DB에 적용되지 않은 것을 잡는다
    # (2026-09-21: 0017~0019가 사흘간 미적용 배포됐던 사고 재발 방지).
    #
    # ⚠️ 이 잡은 배포를 막지 못한다. Vercel은 GitHub Actions와 무관하게 push에 반응해
    # 배포하므로, 이 잡이 실패해도 그 push는 이미 프로덕션에 올라가 있다 — 탐지기일
    # 뿐이다. 진짜 방어선은 lib/ops/healthCheck.ts의 매일 크론(운영자 이메일)이다.
    #
    # push(main)에서만 돈다. PR에서는 돌리지 않는다 — 마이그레이션을 추가하는 PR은
    # 아직 운영에 적용 전이라 "밀림"이 정상 상태이고, 그걸 매번 빨갛게 만들면 이 게이트
    # 자체가 곧 무시된다.
    #
    # TURSO_DATABASE_URL·TURSO_AUTH_TOKEN은 2026-09-23에 GitHub Secrets에 등록됐다 —
    # 이 잡은 실제로 판정한다. 두 값이 사라지면 스크립트가 unknown으로 끝난다.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check migration drift
        run: node scripts/check-migration-drift.mjs
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

  indexnow:
    name: IndexNow (changed URLs only)
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 전량 반복 제출은 스팸성이라 금지(scripts/indexnow-submit.mjs 헤더 참고) — 이 job은
    # push된 커밋에서 바뀐 파일만 URL로 매핑해 제출한다(scripts/indexnow-changed.mjs).
    # IndexNow 제출 실패가 배포 파이프라인을 막아선 안 되므로 continue-on-error.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          # git diff로 이번 push의 변경 파일을 찾으려면 이력이 필요하다(얕은 클론이면 base
          # 커밋이 없어 diff가 실패한다).
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Skip when there is no previous commit (first push / force-push)
        id: gate
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Submit changed URLs to IndexNow
        if: steps.gate.outputs.skip == 'false'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/indexnow-changed.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
