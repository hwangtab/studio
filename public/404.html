<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>스튜디오 놀 - 리다이렉션</title>
    <script type="text/javascript">
      // GitHub Pages에서 SPA 라우팅을 위한 리다이렉션 스크립트
      // 현재 경로를 저장하고 홈페이지로 리다이렉션
      sessionStorage.redirect = location.href;
      // 홈페이지로 리다이렉션
      window.location.href = '/';
    </script>
    <meta http-equiv="refresh" content="0;URL='/'">
  </head>
  <body>
  </body>
</html>
